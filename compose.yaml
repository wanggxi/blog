name: wanggxi-blog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cms:
    build:
      context: .
      target: cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blog}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      PUBLIC_CMS_URL: https://${ADMIN_HOST}
      PUBLIC_SITE_URL: https://${SITE_HOST}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_REGION: ${S3_REGION:-auto}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - media-data:/workspace/apps/cms/media

  web:
    build:
      context: ./frontend
      target: web
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      INTERNAL_CMS_URL: http://cms:3000
      PUBLIC_CMS_URL: https://${ADMIN_HOST}
      PUBLIC_SITE_URL: https://${SITE_HOST}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/"]
      interval: 10s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_HOST: ${ADMIN_HOST}
      API_HOST: ${API_HOST}
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["local-media"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  caddy-config:
  caddy-data:
  minio-data:
  media-data:
  postgres-data:
